# SPDX-License-Identifier: Apache-2.0
#
# 옛 이름을 살려두는 얇은 배포다. 코드는 없다 — `python-hwpx-automation[mcp]`를
# 끌어오고, 옛 import 경로에 안내를 붙인 shim 하나만 담는다.
#
# 이 배포가 존재하는 이유는 두 가지다. 공개된 MCP 클라이언트 설정 수백 곳이
# `hwpx-mcp-server`를 이름으로 실행하고, `pip install hwpx-mcp-server`가 이미
# 손에 익은 사람이 있다. 둘 다 이름 하나 유지하는 비용으로 지킬 수 있다.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hwpx-mcp-server"
version = "7.0.2"
description = "Compatibility shell — installs python-hwpx-automation[mcp] under its former name."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["python-hwpx-automation[mcp]==7.0.2"]

[project.scripts]
"hwpx-mcp-server" = "hwpx_automation.mcp_cli:main"

# extra도 그대로 미러링한다. 런타임 오류 메시지가 사용자에게
# `pip install "hwpx-mcp-server[ingest]"` 를 안내하는데, 셸에 그 extra가 없으면
# 명령은 성공하고 아무것도 설치되지 않는다 — 실측으로 확인했다. 조용히 아무
# 일도 안 일어나는 설치 안내는 없는 것만 못하다.
[project.optional-dependencies]
mcp = ["python-hwpx-automation[mcp]==7.0.2"]
hwp = ["python-hwpx-automation[hwp]==7.0.2"]
http = ["python-hwpx-automation[http]==7.0.2"]
ingest = ["python-hwpx-automation[ingest]==7.0.2"]
oracle = ["python-hwpx-automation[oracle]==7.0.2"]
vision = ["python-hwpx-automation[vision]==7.0.2"]

[project.urls]
Homepage = "https://github.com/airmang/python-hwpx-automation"
Issues = "https://github.com/airmang/python-hwpx-automation/issues"

[tool.setuptools.packages.find]
where = ["src"]
