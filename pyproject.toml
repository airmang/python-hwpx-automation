[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-hwpx-automation"
version = "7.0.2"
description = "Task-oriented HWPX document automation for Python, with an optional MCP adapter."
readme = "README.md"
authors = [{ name = "Kohkyuhyun" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["hwpx", "hancom", "document-automation", "workflow", "mcp", "ai-agent"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    # 6.0 is the floor, not a preference: this package declares the `hwpx` console
    # name that core used to own, and core only stops declaring it at 5.0. Pinning
    # the bounded major here is what makes "no valid install has two declarers"
    # true rather than hopeful, and prevents the next core major from silently
    # breaking an already-published automation line. WP-F (engine surface 6.0):
    # this line adapted to the new namespace surface (design §9 WP-F) — the dev0
    # pre-release qualifier tracks core's own not-yet-tagged 6.0 identity.
    "python-hwpx>=6.0.2,<7", # HWPX object model, OXML/OPC, format-native primitives

    "pydantic>=2.11,<3",
    "cryptography>=42.0",
    "anyio>=4.0",
    # Annotated CallToolResult validation landed in 1.28; the audited private
    # FastMCP seam is intentionally pinned to this minor line and compatibility-tested.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# MCP는 이 제품의 어댑터 하나지 본체가 아니다. office/·workflow/·
# ops_services/·core/ 122개 파일 중 mcp를 import하는 것은 0개다. 파이썬으로
# 문서 자동화만 하는 사용자가 MCP SDK를 강제로 깔 이유가 없다.
mcp = ["mcp==1.28.1"]

# Legacy .hwp (HWP5/OLE2) reading. Lazy-imported; clear error if missing.
hwp = ["olefile>=0.47"]
# HTTP/streamable transport. The default stdio transport needs no extra.
http = ["uvicorn>=0.30"]
# Advertised non-HWPX ingest formats only. Avoid cloud/audio/mail extras and their
# unrelated dependency trees; HTML and text formats are supported by the base.
ingest = ["markitdown[pdf,docx,xlsx]>=0.1.6,<0.2"]
# 직인 날인/검증의 한컴 렌더 오라클 경로(렌더→fitz word/image bbox). macOS+Hancom 필요;
# 없으면 place_seal/check_seal_compliance가 renderChecked=false로 정직하게 degrade한다.
# The imaging stack is declared here now. Core stopped reading PDFs and images
# at 5.0 — its `visual` extra is empty — and this package owns the render oracle,
# the glyph detectors and the PDF rasteriser that need them.
oracle = ["pymupdf>=1.24", "pillow>=10.0", "numpy>=1.26"]
vision = ["pymupdf>=1.24", "pillow>=10.0", "numpy>=1.26"]
test = [
    "pytest>=8.0",
    "build>=1.2",
    # PEP 440 비교. 핀 검사가 5.0.0rc1을 5.0.0으로 오판하지 않게.
    "packaging>=23.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.22",
    # Parse the checked-in GitHub workflow and freeze cross-platform shell semantics.
    "pyyaml>=6.0",
    "olefile>=0.47",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "pillow>=10.0",
    "ruff>=0.12",
]
typecheck = [
    "mypy>=1.10,<3",
    "pyright>=1.1.390,<2",
]

[project.urls]
Homepage = "https://github.com/airmang/python-hwpx-automation"
Issues = "https://github.com/airmang/python-hwpx-automation/issues"

[project.scripts]
# Inherited from python-hwpx 5.0, which no longer declares it. Same command, same
# subcommands; the agent runtime it drives is canonical in this package.
"hwpx" = "hwpx_automation.office.agent.cli:main"
# Canonical optional-adapter command. The bounded 6.x compatibility distribution
# owns the old console so each executable has exactly one distribution owner.
"hwpx-automation-mcp" = "hwpx_automation.mcp_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# 명시적으로 적는다. 이게 없으면 선언이 "src 안의 전부"가 되고, setuptools가
# 재사용하는 stale build/lib 트리에 남은 옛 패키지까지 wheel에 실린다 —
# 이름을 hwpx_automation으로 바꾼 뒤에도 옛 hwpx_mcp_server 197개 항목이
# 그렇게 따라 나왔다.
include = ["hwpx_automation*"]

[tool.setuptools.package-data]
"hwpx_automation" = [
    "identity.json",
    "public-modules.json",
    "py.typed",
    "*.pyi",
]
"hwpx_automation.office.house_style" = ["data/*.json"]
"hwpx_automation.office.authoring.design" = ["profiles/*/*", "profiles/*/fragments/*"]
"hwpx_automation.office.rendering" = [
    "_hancom_open_rate.ps1",
    "_refresh_hwpx_mac.applescript",
    "_render_hwpx.ps1",
    "_render_hwpx_mac.applescript",
]

[tool.pytest.ini_options]
# scripts/ carries the repository QA harnesses. The conformance runner and the
# corpus drivers moved here in the 5.0 train with the rendering pipeline they
# exercise, and their tests import them by bare name.
pythonpath = ["src", "scripts"]
addopts = "-q"
# WP-F (core 6.0 namespace adaptation, design §9): any DeprecationWarning this
# package's own code triggers by calling core's pre-7.0 legacy shim surface is
# a real regression -- error by default, and name each known non-automation
# source precisely rather than silencing DeprecationWarning wholesale.
filterwarnings = [
    "error::DeprecationWarning",
    # hwpx-core's own internal modules still call its pre-6.0 facade
    # internally (core's own migration debt, not automation's -- out of this
    # package's control/scope).
    "ignore::DeprecationWarning:hwpx\\._document\\._legacy",
    "ignore::DeprecationWarning:hwpx\\.form_fit\\.measure",
    "ignore::DeprecationWarning:hwpx\\.ingest\\.hwpx_converter",
    "ignore::DeprecationWarning:hwpx\\.tools\\.mail_merge",
    "ignore::DeprecationWarning:hwpx\\.tools\\.redline",
    # test_fuzz_harness_wired dynamically imports whichever co-located
    # python-hwpx* sibling checkout happens to carry scripts/fuzz (by design
    # it does not pin to PYTHON_HWPX_REPO -- see that test's own docstring);
    # that checkout's migration state is outside this package's control.
    "ignore::DeprecationWarning:fuzz\\.runner",
    # SWIG-generated C-extension types (from a rendering/test dependency)
    # lack __module__ on some builtin types under newer CPython -- a
    # third-party artifact, never an hwpx-sourced warning.
    "ignore:builtin type \\w+ has no __module__ attribute:DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
# Type-check the product surface against the declared 3.10 language level,
# independently of optional runtime dependency stubs installed in the runner.
# Newer NumPy releases legitimately use newer stub syntax; parsing those stubs
# under a 3.10 target made a clean `[oracle,test,typecheck]` install fail before
# mypy reached this package even though third-party imports are already skipped.
no_site_packages = true
files = [
    "src/hwpx_automation/handlers",
    "src/hwpx_automation/ops_services",
    "src/hwpx_automation/runtime.py",
    "src/hwpx_automation/runtime_services.py",
    "src/hwpx_automation/fastmcp_adapter.py",
    "src/hwpx_automation/tool_bindings.py",
    "src/hwpx_automation/server.py",
    "src/hwpx_automation/hwpx_ops.py",
    "src/hwpx_automation/form_fill.py",
    "src/hwpx_automation/office",
    "src/hwpx_automation/tool_contract.py",
    "src/hwpx_automation/workflow/service.py",
]
follow_imports = "skip"
ignore_missing_imports = true
implicit_optional = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "hwpx_automation.office.agent.*"
# The canonical transplant retains upstream cross-check comments used by
# Pyright and by the frozen core mirror.  Mypy does not consume several of
# those codes, so keep the comments without turning them into false failures.
warn_unused_ignores = false

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# Pyright now covers the same surface as mypy. The former exclusion
# ("legacy dynamic python-hwpx objects") became stale after the architecture
# decomposition and typing work — the whole set measures zero errors in basic
# mode. New modules must enter BOTH gates or carry an itemized exclusion here.
include = [
    "src/hwpx_automation/handlers",
    "src/hwpx_automation/ops_services",
    "src/hwpx_automation/runtime.py",
    "src/hwpx_automation/runtime_services.py",
    "src/hwpx_automation/fastmcp_adapter.py",
    "src/hwpx_automation/tool_bindings.py",
    "src/hwpx_automation/server.py",
    "src/hwpx_automation/hwpx_ops.py",
    "src/hwpx_automation/form_fill.py",
    "src/hwpx_automation/office",
    "src/hwpx_automation/tool_contract.py",
    "src/hwpx_automation/workflow/service.py",
]
reportMissingTypeStubs = false

# Itemized residual exclusions. Every file below stays under mypy
# (implicit_optional=true); pyright is deferred for exactly one reason:
# [schema-frozen] tool-facing signatures use implicit-Optional defaults that
#   generate the advertised FastMCP input schemas — rewriting them to explicit
#   Optional changes the published contract and belongs to a contract-changing
#   release, not a typing ramp.
# The former [dynamic-seam] set (ops_services/{form_fields,save_policy,tables,
#   transactions}.py and workflow/service.py) is resolved: the core
#   Path/str seam is typed and the guarded exact-sidecar publication is narrowed
#   to LocalDocumentStorage at the consumers, so all five now pass pyright basic
#   inside the gate with no exclusion.
exclude = [
    "src/hwpx_automation/handlers/agent_document.py",   # schema-frozen
    "src/hwpx_automation/handlers/authoring.py",        # schema-frozen
    "src/hwpx_automation/handlers/content_edit.py",     # schema-frozen
    "src/hwpx_automation/handlers/form_fill.py",        # schema-frozen
    "src/hwpx_automation/handlers/layout_style.py",     # schema-frozen
    "src/hwpx_automation/handlers/quality_render.py",   # schema-frozen
    "src/hwpx_automation/handlers/read_export.py",      # schema-frozen
    "src/hwpx_automation/handlers/specialized.py",      # schema-frozen
    "src/hwpx_automation/handlers/workflow.py",         # schema-frozen
]
