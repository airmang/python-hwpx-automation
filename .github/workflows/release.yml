name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write
  id-token: write

jobs:
  prepublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: python-hwpx-automation
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Every version this job uses comes from identity.json through this one
      # step. Before it existed the workflow restated the train coordinates as
      # literals, and a literal left on the previous train produced the
      # preserved failure tags v6.6.0 and v6.6.3. Do not add a version literal
      # below; tests/test_release_coordinate_derivation.py fails the build.
      - name: Derive release coordinates from identity.json
        id: coords
        working-directory: python-hwpx-automation
        run: python scripts/release_coordinates.py --verify --github-output
      # The runtime-parity suites read fixtures from a python-hwpx REPO
      # checkout (the installed wheel ships no tests/); pin the exact
      # released core tag this train observes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: airmang/python-hwpx
          ref: ${{ steps.coords.outputs.candidate_core_tag }}
          path: python-hwpx
      - name: Observe Phase-0 legacy cap before resolving core 5
        working-directory: python-hwpx-automation
        env:
          LEGACY_CORE: ${{ steps.coords.outputs.legacy_core_version }}
          LEGACY_COMPAT: ${{ steps.coords.outputs.legacy_compatibility_version }}
          LEGACY_DIST: >-
            ${{ steps.coords.outputs.legacy_compatibility_distribution }}
          LEGACY_REQ_COUNT: >-
            ${{ steps.coords.outputs.legacy_core_requirement_count }}
        run: |
          PHASE0_VENV="${RUNNER_TEMP}/hwpx-phase0-legacy"
          python -m venv "${PHASE0_VENV}"
          "${PHASE0_VENV}/bin/python" -m pip install --only-binary=:all: \
            "packaging>=23" \
            "python-hwpx==${LEGACY_CORE}" \
            "${LEGACY_DIST}==${LEGACY_COMPAT}"
          "${PHASE0_VENV}/bin/python" -m pip check
          "${PHASE0_VENV}/bin/python" - <<'PY'
          import json
          import os
          from importlib.metadata import metadata, version
          from pathlib import Path
          from packaging.requirements import Requirement

          legacy_core = os.environ["LEGACY_CORE"]
          legacy_compat = os.environ["LEGACY_COMPAT"]
          legacy_dist = os.environ["LEGACY_DIST"]
          expected_count = int(os.environ["LEGACY_REQ_COUNT"])
          floors = json.loads(
              Path("src/hwpx_automation/identity.json").read_text(
                  encoding="utf-8"
              )
          )["releaseFloors"]

          assert version("python-hwpx") == legacy_core
          assert version(legacy_dist) == legacy_compat
          requirements = [
              Requirement(item)
              for item in metadata(legacy_dist).get_all("Requires-Dist") or []
          ]
          core = [item for item in requirements if item.name == "python-hwpx"]
          base = [item for item in core if item.marker is None]
          assert len(base) == 1, core
          assert len(core) == expected_count, core
          expected_specifiers = set(floors["legacyCoreSpecifiers"])
          assert all(
              {str(specifier) for specifier in item.specifier}
              == expected_specifiers
              for item in core
          ), core
          import hwpx_mcp_server
          PY
      - name: Install test dependencies
        working-directory: python-hwpx-automation
        env:
          CANDIDATE_CORE: ${{ steps.coords.outputs.candidate_core }}
        run: |
          # Release order is legacy cap -> core -> automation -> compatibility -> plugin.
          # A tag release must observe the exact public core rather than a
          # sibling checkout or an unpublished branch.
          python -m pip install "python-hwpx[visual,preview]==${CANDIDATE_CORE}"
          python -m pip install -e ".[mcp,oracle,test,typecheck]"
      # The clean installed-wheel gates (docs example, compat matrix) fail
      # closed without uv; runners do not ship it.
      - name: Install uv for the clean installed-wheel gates
        working-directory: python-hwpx-automation
        run: python -m pip install "uv>=0.7"
      - name: Observe public core dependency remote truth
        working-directory: python-hwpx-automation
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_CORE: ${{ steps.coords.outputs.candidate_core }}
          CANDIDATE_CORE_TAG: ${{ steps.coords.outputs.candidate_core_tag }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          assert version("python-hwpx") == os.environ["CANDIDATE_CORE"]
          PY
          gh release view "${CANDIDATE_CORE_TAG}" \
            --repo airmang/python-hwpx \
            --json tagName,isDraft,isPrerelease \
            --jq "select(.tagName == \"${CANDIDATE_CORE_TAG}\" and (.isDraft | not) and (.isPrerelease | not)) | .tagName" \
            | grep -Fx "${CANDIDATE_CORE_TAG}"
      # currentPublic is a claim that a stack is already installable. Verify it
      # against services we do not control instead of against a dictionary
      # someone has to remember to edit. The frozen dictionary this replaces
      # produced the preserved failure tags v6.1.2, v6.4.1, and v6.7.0 and
      # caught no real defect; in v6.1.2 and v6.4.1 the CHANGELOG records that
      # a correct identity was rejected by a stale expectation.
      - name: Observe that currentPublic is really published
        working-directory: python-hwpx-automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_current_public_remote.py --require-network
      - name: Check public repository hygiene
        working-directory: python-hwpx-automation
        run: |
          python scripts/check_public_hygiene.py
          python scripts/check_transition_identity.py
      - name: Run first-stage Ruff gate
        working-directory: python-hwpx-automation
        run: ruff check --select E9,F .
      - name: Run release type and architecture gates
        working-directory: python-hwpx-automation
        run: |
          python -m mypy
          pyright --pythonpath "$(command -v python)"
          python scripts/check_architecture_ratchets.py
      - name: Run release-facing tests
        working-directory: python-hwpx-automation
        run: python -m pytest -q
      - name: Run public core compatibility install matrix
        working-directory: python-hwpx-automation
        env:
          CANDIDATE_CORE: ${{ steps.coords.outputs.candidate_core }}
          LEGACY_CORE: ${{ steps.coords.outputs.legacy_core_version }}
          LEGACY_COMPAT: ${{ steps.coords.outputs.legacy_compatibility_version }}
        run: |
          python -m pip install build
          python -m pip wheel --no-deps --wheel-dir .compat-core-wheel \
            "python-hwpx==${CANDIDATE_CORE}"
          CORE_WHEEL=$(find .compat-core-wheel -name 'python_hwpx-*.whl' -print -quit)
          python scripts/check_compat_install_matrix.py \
            --core-wheel "${CORE_WHEEL}" \
            --legacy-version "${LEGACY_COMPAT}" \
            --legacy-core-version "${LEGACY_CORE}"
      - name: Verify generated ToolSpec documentation
        working-directory: python-hwpx-automation
        run: |
          python scripts/render_tool_contract.py --check --skip-skill
          python scripts/render_contract_delta.py --check
      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Gate minimum-Python clean wheel and optional boundaries
        working-directory: python-hwpx-automation
        env:
          CANDIDATE_CORE: ${{ steps.coords.outputs.candidate_core }}
        run: |
          python -m pip install "build>=1.2"
          mkdir -p .minimum-core-wheel
          python -m pip wheel --no-deps --wheel-dir .minimum-core-wheel \
            "python-hwpx==${CANDIDATE_CORE}"
          CORE_WHEEL=$(find .minimum-core-wheel \
            -name "python_hwpx-${CANDIDATE_CORE}-*.whl" -print -quit)
          test -n "${CORE_WHEEL}"
          python scripts/check_platform_optional_smoke.py \
            --core-wheel "${CORE_WHEEL}"

  release:
    needs: prepublish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate tag/version consistency
        shell: bash
        run: |
          set -euo pipefail
          # The whole gate lives in scripts/check_tag_release_gate.py so it can
          # be dry-run without pushing a tag. Logic embedded in this workflow
          # could only ever be exercised by tagging, which is why its mistakes
          # became preserved failure tags instead of red tests.
          python scripts/check_tag_release_gate.py
      - name: Extract latest changelog section for release notes
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          # Find the first released version heading, skipping [Unreleased].
          start = next(
              (
                  i
                  for i, line in enumerate(lines)
                  if line.startswith('## [') and 'unreleased' not in line.lower()
              ),
              None,
          )
          if start is None:
              raise SystemExit('CHANGELOG.md에서 릴리스 섹션을 찾지 못했습니다.')

          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith('## [')),
              len(lines),
          )

          section = '\n'.join(lines[start:end]).strip() + '\n'
          Path('release_notes.md').write_text(section, encoding='utf-8')
          PY

      - name: Prepare exact git-archive release input
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SOURCE=$(mktemp -d \
            "${RUNNER_TEMP}/python-hwpx-automation-release.XXXXXX")
          git archive --format=tar "${GITHUB_SHA}" \
            | tar --extract --directory="${RELEASE_SOURCE}"
          python "${RELEASE_SOURCE}/scripts/check_release_build_input.py" \
            --root "${RELEASE_SOURCE}"
          echo "RELEASE_SOURCE=${RELEASE_SOURCE}" >> "${GITHUB_ENV}"

      - name: Build canonical distribution
        run: |
          python -m pip install --upgrade build twine
          rm -rf dist
          python -m build --outdir "${GITHUB_WORKSPACE}/dist/canonical" \
            "${RELEASE_SOURCE}"
          twine check dist/canonical/*
          python scripts/check_public_hygiene.py
          python - <<'CHECK'
          import pathlib, sys
          names = {
              p.name.split("-")[0]
              for p in pathlib.Path("dist/canonical").glob("*.whl")
          }
          if names != {"python_hwpx_automation"}:
              sys.exit(f"canonical artifact selection failed: {sorted(names)}")
          CHECK

      - name: Prebuild compatibility distribution before any publish
        run: |
          rm -rf dist/compat
          python -m build --outdir "${GITHUB_WORKSPACE}/dist/compat" \
            "${RELEASE_SOURCE}/compat/hwpx-mcp-server"
          twine check dist/compat/*
          # The hygiene scanner walks dist recursively. Run it again only after
          # the compatibility archives exist so all four release artifacts are
          # covered before the first upload.
          python scripts/check_public_hygiene.py
          python - <<'CHECK'
          import pathlib, sys
          names = {
              p.name.split("-")[0]
              for p in pathlib.Path("dist/compat").glob("*.whl")
          }
          if names != {"hwpx_mcp_server"}:
              sys.exit(f"compat artifact selection failed: {sorted(names)}")
          CHECK

      - name: Publish canonical automation to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/canonical/

      - name: Observe canonical PyPI truth before compatibility publish
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            rm -rf .canonical-remote
            python -m venv .canonical-remote
            if .canonical-remote/bin/python -m pip install \
              "python-hwpx-automation[mcp]==${VERSION}"; then
              .canonical-remote/bin/python - <<'PY'
          import os
          from importlib.metadata import version
          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert version("python-hwpx-automation") == expected
          import hwpx_automation
          import hwpx_automation.server
          PY
              break
            fi
            if [[ "${attempt}" == "6" ]]; then
              echo "canonical PyPI artifact did not become observable" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify compatibility artifact resolves canonical remote
        run: |
          python -m venv .compat-candidate
          .compat-candidate/bin/python -m pip install dist/compat/*.whl
          .compat-candidate/bin/python -m pip check
          .compat-candidate/bin/python - <<'PY'
          from importlib.metadata import version
          assert version("hwpx-mcp-server") == version("python-hwpx-automation")
          import hwpx_mcp_server
          import hwpx_mcp_server.office.exam
          PY

      - name: Publish compatibility shell to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/compat/

      - name: Observe compatibility PyPI truth
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            rm -rf .compat-remote
            python -m venv .compat-remote
            if .compat-remote/bin/python -m pip install \
              "hwpx-mcp-server==${VERSION}"; then
              .compat-remote/bin/python -m pip check
              .compat-remote/bin/python - <<'PY'
          import hwpx_mcp_server.office.exam
          import hwpx_automation.office.exam
          PY
              break
            fi
            if [[ "${attempt}" == "6" ]]; then
              echo "compatibility PyPI artifact did not become observable" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Write release-approved plugin handoff receipt
        run: |
          mkdir -p release-artifacts
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          identity = json.loads(
              Path("src/hwpx_automation/identity.json").read_text(encoding="utf-8")
          )
          release_state = identity["releaseState"]
          if release_state["status"] != "release-approved":
              raise SystemExit("handoff receipt requires release-approved")
          candidate = release_state["candidate"]
          current_public = release_state["currentPublic"]
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if version not in {
              candidate["canonicalAutomation"],
              candidate["compatibility"],
          }:
              raise SystemExit("tag does not match the automation train")

          receipt = {
              "schemaVersion": "python-hwpx-automation.plugin-handoff/v1",
              "globalReleaseState": "release-approved",
              "currentPublic": current_public,
              "candidate": candidate,
              "observedRemoteTruth": {
                  "pythonHwpxPyPIAndGitHubRelease": candidate["pythonHwpx"],
                  "canonicalAutomationPyPI": candidate["canonicalAutomation"],
                  "compatibilityPyPI": candidate["compatibility"],
              },
              "automationGitHubRelease": {
                  "tag": os.environ["GITHUB_REF_NAME"],
                  "evidence": "this receipt is valid when attached to the successful release",
              },
              "remainingBeforeGlobalPromotion": {
                  "pluginGitHubRelease": candidate["plugin"],
                  "marketplaceEntry": candidate["plugin"],
                  "realMarketplaceInstall": {
                      "plugin": candidate["plugin"],
                      "contractHash": candidate["contractHash"],
                  },
              },
              "promotionForbiddenUntilRemainingObserved": True,
          }
          output = Path(
              "release-artifacts/"
              f"python-hwpx-automation-{os.environ['GITHUB_REF_NAME']}"
              "-plugin-handoff.json"
          )
          output.write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate release SBOM after both automation PyPI observations
        run: |
          python -m venv .sbom-runtime
          .sbom-runtime/bin/python -m pip install \
            dist/canonical/*.whl dist/compat/*.whl
          python -m venv .sbom-tool
          .sbom-tool/bin/python -m pip install "cyclonedx-bom==7.3.0"
          mkdir -p release-artifacts
          .sbom-tool/bin/cyclonedx-py environment .sbom-runtime/bin/python \
            --pyproject pyproject.toml \
            --mc-type application \
            --output-reproducible \
            --output-format JSON \
            --output-file "release-artifacts/python-hwpx-automation-${GITHUB_REF_NAME}.cdx.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: release_notes.md
          draft: false
          files: |
            dist/canonical/*
            dist/compat/*
            release-artifacts/*
          prerelease: false

      - name: Observe automation GitHub Release and record plugin handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RECEIPT_NAME="python-hwpx-automation-${GITHUB_REF_NAME}-plugin-handoff.json"
          gh release view "${GITHUB_REF_NAME}" \
            --json tagName,isDraft,isPrerelease \
            --jq 'select((.isDraft | not) and (.isPrerelease | not)) | .tagName' \
            | grep -Fx "${GITHUB_REF_NAME}"
          gh release view "${GITHUB_REF_NAME}" \
            --json assets --jq '.assets[].name' \
            | grep -Fx "${RECEIPT_NAME}"
          HANDOFF_LINE=$(python scripts/release_coordinates.py --handoff-summary)
          CANDIDATE_TRIPLE=$(python scripts/release_coordinates.py --candidate-triple)
          {
            echo "### Automation publication observed; plugin handoff ready"
            echo
            echo "Core, canonical automation, compatibility, and this GitHub"
            echo "Release have remote evidence. The global state remains"
            echo "${HANDOFF_LINE}"
            echo "Pass ${RECEIPT_NAME} to plugin publication. Only after the"
            echo "plugin GitHub Release, marketplace entry, and a real marketplace"
            echo "install are observed may a follow-up commit promote the coherent"
            echo "${CANDIDATE_TRIPLE} stack to released."
          } >> "${GITHUB_STEP_SUMMARY}"
