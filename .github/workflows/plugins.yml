name: Plugins

# Tests for the hwpx-plugins source that moved into plugins-src/. It replaces
# the plugin-contract job of airmang/hwpx-plugins tests.yml. The difference:
# automation is this checkout (`pip install -e .`), not a second repository at
# a candidate ref, so a plugin change and the automation change it needs are
# tested together in one pull request.
#
# Generated host bundles are built here only to validate them; they are never
# committed to main (plugins-src/.gitignore). plugins-dist.yml publishes them.

on:
  push:
    branches: [main]
    paths:
      - "plugins-src/**"
      - "src/hwpx_automation/**"
      - "pyproject.toml"
      - ".github/workflows/plugins.yml"
  pull_request:
    paths:
      - "plugins-src/**"
      - "src/hwpx_automation/**"
      - "pyproject.toml"
      - ".github/workflows/plugins.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: python-hwpx-automation
      # Same core ref as tests.yml. TODO(core-7.0-release): install
      # "python-hwpx>=7.0,<8" from PyPI and keep this checkout only for fixtures.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: airmang/python-hwpx
          ref: ${{ vars.PYTHON_HWPX_CANDIDATE_REF || 'd1686a4b47f8e07a0f899c45f37637a4e863cf00' }}
          path: python-hwpx
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv pip install --system -e ./python-hwpx -e './python-hwpx-automation[mcp,oracle,test]' 'ruff>=0.12'
      - name: Check plugin public hygiene
        working-directory: python-hwpx-automation/plugins-src
        run: python scripts/check_public_hygiene.py
      - name: Run first-stage Ruff gate
        working-directory: python-hwpx-automation/plugins-src
        run: ruff check --select E9,F .
      - name: Parse shipped Python and Markdown code
        working-directory: python-hwpx-automation/plugins-src
        run: python scripts/validate_shipped_code.py
      - name: Version literals come from identity.json
        working-directory: python-hwpx-automation
        run: python plugins-src/scripts/project_identity.py --check
      - name: Skill tool contract matches this automation
        working-directory: python-hwpx-automation
        run: python scripts/render_tool_contract.py --check --skill-root plugins-src
      - name: Vendor the Claude engine and build all host bundles
        working-directory: python-hwpx-automation/plugins-src
        run: |
          python scripts/vendor_claude_engine.py
          python scripts/build_hwpx_plugins.py
          python scripts/validate_hwpx_plugin.py
          python scripts/check_bundle_limits.py
      - name: Skill tests
        working-directory: python-hwpx-automation/plugins-src
        run: python -m pytest -q tests
      - name: Claude locked runtime smoke
        working-directory: python-hwpx-automation/plugins-src
        run: python scripts/claude_locked_runtime_smoke.py
      - name: Claude chat path (vendored engine, no MCP) simulation
        working-directory: python-hwpx-automation/plugins-src
        run: python scripts/claude_chat_sim.py --python python --fixtures ../../python-hwpx/tests/fixtures
      - name: Plugin launcher protocol E2E (editable stack)
        working-directory: python-hwpx-automation/plugins-src
        run: >-
          python scripts/plugin_mcp_e2e.py
          --automation-repo .. --core-repo ../../python-hwpx
          --expected-core-version "$(python -c "import importlib.metadata as m; print(m.version('python-hwpx'))")"
          --expected-server-version "$(python -c "import importlib.metadata as m; print(m.version('python-hwpx-automation'))")"
