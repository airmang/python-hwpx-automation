name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tag-time release gate, exercised on every push instead of only when a
  # tag is created. Thirteen preserved failure tags exist because this logic
  # could previously be executed only by pushing a tag; nine of them were a
  # stale coordinate that this job now surfaces days earlier, on a branch.
  release-gate-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bootstrap the gate's own dependencies
        run: >-
          python -m pip install
          "packaging>=23.0"
          "tomli>=2.0; python_version < '3.11'"
      - name: Derive release coordinates
        run: python scripts/release_coordinates.py --verify --json
      - name: Dry-run the tag release gate without a tag
        run: python scripts/check_tag_release_gate.py --dry-run
      # Network-dependent, so it degrades instead of failing the branch build.
      # The release workflow runs the same script with --require-network.
      - name: Observe that currentPublic is really published
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_current_public_remote.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: python-hwpx-automation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: airmang/python-hwpx
          # During the unpublished train this repository variable may name the
          # clean candidate branch. After core 5.0 lands, main is authoritative.
          ref: ${{ vars.PYTHON_HWPX_CANDIDATE_REF || 'main' }}
          path: python-hwpx
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # This gate intentionally runs before either product is installed.  Its
      # own parser/comparator dependencies therefore have to be bootstrapped
      # explicitly, especially on Python 3.10 where tomllib is not in stdlib.
      - name: Install pinned-floor gate dependencies
        run: >-
          python -m pip install
          "packaging>=23.0"
          "tomli>=2.0; python_version < '3.11'"
      # The suite's clean installed-wheel gate builds throwaway venvs with uv
      # and fails closed when the binary is absent; runners do not ship it.
      - name: Install uv for the clean installed-wheel gate
        run: python -m pip install "uv>=0.7"
      - name: Pinned core satisfies the declared floor
        run: python scripts/check_pinned_core_satisfies_floor.py ../python-hwpx
        working-directory: python-hwpx-automation
      - run: python -m pip install -e "../python-hwpx[visual,preview]"
        working-directory: python-hwpx-automation
      # [mcp]를 뺄 수 없다: 아래 단계가 hwpx_automation.server를 import하고
      # 그건 mcp SDK를 필요로 한다. [oracle]도 이 저장소가 core에서 인수한
      # 렌더/wordbox 소유자의 정적 타입 검사를 위해 필요하다.
      - run: python -m pip install -e ".[mcp,oracle,test,typecheck]"
        working-directory: python-hwpx-automation
      - run: python scripts/check_public_hygiene.py
        working-directory: python-hwpx-automation
      - run: python scripts/check_transition_identity.py
        working-directory: python-hwpx-automation
      - name: Ruff source and touched-seam gates
        run: |
          ruff check --select E9,F .
          ruff check --select E4,E7,E9,F \
            src/hwpx_automation/handlers \
            src/hwpx_automation/ops_services \
            src/hwpx_automation/runtime.py \
            src/hwpx_automation/runtime_services.py \
            src/hwpx_automation/fastmcp_adapter.py \
            src/hwpx_automation/tool_bindings.py \
            src/hwpx_automation/server.py \
            src/hwpx_automation/hwpx_ops.py \
            src/hwpx_automation/form_fill.py \
            src/hwpx_automation/office \
            src/hwpx_automation/tool_contract.py \
            src/hwpx_automation/workflow/service.py \
            scripts/check_architecture_ratchets.py \
            tests/test_architecture_ratchets.py
        working-directory: python-hwpx-automation
      - name: Static type gates
        run: |
          python -m mypy
          pyright --pythonpath "$(command -v python)"
        working-directory: python-hwpx-automation
      - run: python scripts/check_architecture_ratchets.py
        working-directory: python-hwpx-automation
      - name: Run structural conformance golden
        run: |
          python scripts/run_conformance.py run \
            --tier structural \
            --check tests/conformance/golden/structural.json
        working-directory: python-hwpx-automation
      - run: python -m pytest -q
        working-directory: python-hwpx-automation
      # The core fuzz harness builds documents through this package's builder,
      # so core's own CI can only skip it — and importorskip meant it silently
      # ran nowhere from the 5.0 split until this step existed. It runs here,
      # where both sides are installed, as a fixed-seed regression asset.
      - name: Run the core fuzz regression harness
        working-directory: python-hwpx-automation
        run: >-
          python -m pytest -q
          ../python-hwpx/tests/test_fuzz_loop.py
          ../python-hwpx/tests/test_fuzz_regressions.py
      - run: |
          python scripts/render_tool_contract.py --check --skip-skill
          python scripts/render_contract_delta.py --check
        working-directory: python-hwpx-automation

  # Issue #98: every Windows save failed because os.open defaulted to CRT
  # text mode, so snapshot digests never matched binary reads. POSIX runners
  # cannot reproduce text-mode descriptor semantics, so the workspace
  # publication fallback must be exercised on a real Windows runner.
  windows-publish-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: python-hwpx-automation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: airmang/python-hwpx
          ref: ${{ vars.PYTHON_HWPX_CANDIDATE_REF || 'main' }}
          path: python-hwpx
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e "../python-hwpx[visual,preview]"
        working-directory: python-hwpx-automation
      - run: python -m pip install -e ".[mcp,test]"
        working-directory: python-hwpx-automation
      - run: python -m pytest -q tests/test_workspace_windows_gate.py
        working-directory: python-hwpx-automation

  clean-package-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            extras: ""
            markitdown: absent
            mcp: absent
          - label: all-runtime-extras
            extras: "[mcp,hwp,http,ingest,oracle,vision]"
            markitdown: present
            mcp: present
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: python-hwpx-automation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: airmang/python-hwpx
          ref: ${{ vars.PYTHON_HWPX_CANDIDATE_REF || 'main' }}
          path: python-hwpx
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build exact core and automation wheels from clean archives
        run: |
          python -m pip install build
          mkdir -p clean-src/python-hwpx clean-src/python-hwpx-automation
          git -C python-hwpx archive HEAD | tar -x -C clean-src/python-hwpx
          git -C python-hwpx-automation archive HEAD | tar -x -C clean-src/python-hwpx-automation
          python clean-src/python-hwpx-automation/scripts/check_release_build_input.py \
            --root clean-src/python-hwpx-automation
          python -m build --wheel --outdir candidate-wheelhouse clean-src/python-hwpx
          python -m build --wheel --outdir candidate-wheelhouse clean-src/python-hwpx-automation
          python python-hwpx-automation/scripts/check_public_hygiene.py
          python python-hwpx-automation/scripts/check_transition_identity.py
      - name: Install wheel in a clean environment
        working-directory: python-hwpx-automation
        env:
          EXTRAS: ${{ matrix.extras }}
          EXPECT_MARKITDOWN: ${{ matrix.markitdown }}
          EXPECT_MCP: ${{ matrix.mcp }}
        run: |
          python -m venv .clean-package
          CORE_WHEEL=$(find ../candidate-wheelhouse -name 'python_hwpx-*.whl' -print -quit)
          SERVER_WHEEL=$(find ../candidate-wheelhouse -name 'python_hwpx_automation-*.whl' -print -quit)
          .clean-package/bin/python -m pip install "${CORE_WHEEL}"
          .clean-package/bin/python -m pip install "${SERVER_WHEEL}${EXTRAS}"
          .clean-package/bin/python -m pip check
          .clean-package/bin/python - <<'PY'
          import importlib.util
          import os
          import subprocess
          import sys
          from importlib.metadata import entry_points, metadata

          requirements = metadata("python-hwpx-automation").get_all("Requires-Dist") or []
          mcp_requirements = [
              item for item in requirements if item.casefold().startswith("mcp")
          ]
          assert mcp_requirements
          assert all(
              "extra ==" in item and "mcp" in item.split(";", 1)[-1]
              for item in mcp_requirements
          )
          found = importlib.util.find_spec("markitdown") is not None
          assert found is (os.environ["EXPECT_MARKITDOWN"] == "present")
          mcp_found = importlib.util.find_spec("mcp") is not None
          assert mcp_found is (os.environ["EXPECT_MCP"] == "present")
          assert importlib.util.find_spec("hwpx_automation.practice") is None
          import hwpx_automation
          assert "hwpx_automation.api" not in sys.modules
          assert not any(
              name == "mcp" or name.startswith("mcp.")
              for name in sys.modules
          )
          import hwpx_automation.api
          assert not any(name == "mcp" or name.startswith("mcp.") for name in sys.modules)
          scripts = {
              item.name: item.value
              for item in entry_points(group="console_scripts")
              if item.name in {"hwpx", "hwpx-automation-mcp", "hwpx-mcp-server"}
          }
          assert scripts == {
              "hwpx": "hwpx_automation.office.agent.cli:main",
              "hwpx-automation-mcp": "hwpx_automation.mcp_cli:main",
          }
          if mcp_found:
              import hwpx_automation.server
          else:
              result = subprocess.run(
                  [sys.executable, "-m", "hwpx_automation.mcp_cli", "--help"],
                  text=True,
                  capture_output=True,
              )
              assert result.returncode == 2
              assert "python-hwpx-automation[mcp]" in result.stderr
          PY

      - name: Type-check installed root and API facades
        if: matrix.label == 'base'
        working-directory: python-hwpx-automation
        run: |
          .clean-package/bin/python -m pip install \
            "mypy>=1.10,<3" "pyright>=1.1.390,<2"
          .clean-package/bin/python -m mypy \
            --config-file tests/typing/mypy-installed.ini \
            tests/typing/installed_facade_smoke.py
          .clean-package/bin/python -m pyright \
            --project tests/typing/pyright-installed.json \
            --pythonpath "$(pwd)/.clean-package/bin/python"

  platform-oracle-smoke:
    name: Python 3.10 ${{ matrix.os }} clean oracle boundary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: python-hwpx-automation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: airmang/python-hwpx
          ref: ${{ vars.PYTHON_HWPX_CANDIDATE_REF || 'main' }}
          path: python-hwpx
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Build and smoke clean canonical oracle wheel
        working-directory: python-hwpx-automation
        run: |
          python -m pip install "build>=1.2"
          python scripts/check_platform_optional_smoke.py --core-repo ../python-hwpx
