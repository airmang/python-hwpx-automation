<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HWPX 미리보기</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#20252b;font:15px system-ui}header{position:sticky;top:0;background:#fff;padding:18px 24px;border-bottom:1px solid #d9dde2;z-index:2}h1{font-size:20px;margin:0 0 12px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button,.file{border:1px solid #ccd2da;border-radius:6px;background:white;padding:9px 14px;font:inherit;cursor:pointer}button:focus-visible,.file:focus-within,textarea:focus-visible{outline:3px solid #3678e0;outline-offset:2px}button:disabled{opacity:.5;cursor:default}.primary{background:#245ccc;color:white;border-color:#245ccc}input[type=file]{position:absolute;width:1px;height:1px;opacity:0}small{display:block;margin-top:12px;color:#616a76}details{margin-top:12px}textarea{display:block;width:min(100%,500px);height:65px;margin:8px 0;font:14px monospace;border:1px solid #bbc3ce;border-radius:5px;padding:9px}#status{padding:16px 24px;background:#f7f9fb;border-bottom:1px solid #d9dde2}#issue{white-space:pre-wrap;color:#943921;margin:0}main{max-width:1000px;margin:24px auto}figure{margin:24px 16px}figcaption{color:#616a76;margin:8px 0}img{display:block;width:100%;background:white;box-shadow:0 3px 12px #0002}.paper{position:relative;aspect-ratio:59528 / 84186;background:white;box-shadow:0 3px 12px #0002}.paper img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;box-shadow:none}.empty{padding:50px 24px;text-align:center;color:#616a76}
</style><header><h1>HWPX 미리보기</h1><div class="controls"><label class="file primary" tabindex="0">문서 열기<input id="file" type="file" accept=".hwpx"></label><button id="cancel" disabled>처리 취소</button><button id="stop">종료</button></div><details><summary>글꼴 대체 설정</summary><label for="fonts">필요한 경우 원래 글꼴과 사용할 글꼴을 지정하세요.</label><textarea id="fonts" spellcheck="false" placeholder='{"휴먼명조":"함초롬바탕"}'>{}</textarea><small>함초롬바탕·함초롬돋움 포함. 맑은 고딕은 Windows 시스템 글꼴을 사용합니다. 대체 글꼴에 따라 줄바꿈과 모양이 달라질 수 있습니다.</small></details><small>문서는 이 컴퓨터의 렌더러에서 처리합니다. 32 MiB·256쪽 한도. 지원하지 않는 서식은 사유를 표시합니다.</small></header>
<div id="status" role="status" aria-live="polite">문서를 선택하세요.</div><p id="issue" role="alert"></p><main id="pages"><p class="empty">표와 그림을 포함한 HWPX 문서를 열어 미리보기를 확인하세요.</p></main>
<script>
const token=location.hash.slice(1)||sessionStorage.getItem('hwpx-preview-token');if(location.hash){sessionStorage.setItem('hwpx-preview-token',token);history.replaceState(null,'',location.pathname);}let seen=null,shown=null,alive=true,busy=false;
const $=id=>document.getElementById(id);const encode=value=>btoa(String.fromCharCode(...new TextEncoder().encode(value))).replaceAll('+','-').replaceAll('/','_');
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'X-Preview-Token':token,...options.headers}});const body=await response.json();if(!response.ok)throw Error(body.error||'요청을 처리하지 못했습니다.');return body;}
document.querySelector('.file').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();$('file').click();}});
$('file').addEventListener('change',async()=>{const file=$('file').files[0];if(!file)return;try{if(file.size>32*1024*1024)throw Error('입력 파일은 32 MiB 이하여야 합니다.');const mapping=JSON.parse($('fonts').value);busy=true;$('status').textContent='파일을 읽고 있습니다…';const data=await file.arrayBuffer();await api('/api/render',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Preview-Name':encode(file.name),'X-Preview-Fonts':encode(JSON.stringify(mapping))},body:data});$('issue').textContent='';}catch(error){$('issue').textContent=error.message;}finally{busy=false;$('file').value='';}});
$('cancel').onclick=async()=>{try{await api('/api/cancel',{method:'POST',body:''});}catch(error){$('issue').textContent=error.message;}};
$('stop').onclick=async()=>{try{await api('/api/shutdown',{method:'POST',body:''});alive=false;$('status').textContent='미리보기 실행기가 종료되었습니다.';$('cancel').disabled=true;}catch(error){$('issue').textContent=error.message;}};
let observer=null;
async function display(job){const result=job.result;if(observer)observer.disconnect();$('pages').replaceChildren();observer=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;observer.unobserve(entry.target);const image=entry.target;fetch(`/api/pages/${job.id}/p${image.dataset.page}.png`,{headers:{'X-Preview-Token':token}}).then(r=>{if(!r.ok)throw Error('페이지를 읽지 못했습니다.');return r.blob();}).then(blob=>{if(shown!==job.id)return;const url=URL.createObjectURL(blob);image.src=url;image.onload=()=>URL.revokeObjectURL(url);}).catch(error=>{if(shown===job.id)$('issue').textContent=error.message;});}},{rootMargin:'1000px'});for(let index=0;index<result.pages;index++){const figure=document.createElement('figure');const caption=document.createElement('figcaption');caption.textContent=`${index+1} / ${result.pages}`;const image=document.createElement('img');const paper=document.createElement('div');paper.className='paper';image.dataset.page=index;image.loading='lazy';image.alt=`${index+1}쪽`;paper.append(image);figure.append(caption,paper);$('pages').append(figure);observer.observe(image);}}
async function poll(){if(!alive)return;try{const snapshot=await api('/api/status');const job=snapshot.latest;if(job){$('cancel').disabled=!['queued','running'].includes(job.state);if(!busy){const names={queued:'대기 중',running:'미리보기 만드는 중…',ready:'완료',error:'처리 실패',cancelled:'취소됨',superseded:'새 문서 처리 중'};$('status').textContent=job.label+' · '+names[job.state]+(snapshot.watching?' · 변경 감지 켜짐':'');}const stamp=job.id+':'+job.state;if(stamp!==seen){seen=stamp;$('issue').textContent='';if(job.state==='error')$('issue').textContent=job.result?.error||'렌더링에 실패했습니다.';else if(job.state==='ready'&&job.result.status!=='supported'){$('issue').textContent='지원하지 않는 서식입니다.\n'+JSON.stringify(job.result.unsupported||job.result.errors,null,2);}}if(snapshot.displayedJob&&snapshot.displayed!==shown){shown=snapshot.displayed;await display(snapshot.displayedJob);}if(snapshot.displayed!==job.id&&shown!==null)$('status').textContent+=' · 이전 미리보기 표시 중';}if(snapshot.watchError)$('issue').textContent=snapshot.watchError;}catch(error){$('issue').textContent=error.message;alive=false;}if(alive)setTimeout(poll,300);}
poll();
</script></html>
